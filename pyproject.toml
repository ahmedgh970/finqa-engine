[project]
name = "finqa-engine"
version = "0.1.0"
description = "Production-ready agentic RAG for financial document Q&A, benchmarked on FinanceBench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Data handling
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # Local LLM serving (Ollama HTTP API)
    "requests>=2.31.0",
    # Vector DB
    "qdrant-client>=1.9.0",
    # Embeddings (needed at serving time to embed queries)
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    # BM25
    "rank-bm25>=0.2.2",
    # Evaluation
    "ragas>=0.1.0",
    # Orchestration
    # Capped below 1.0: ragas 0.4.3 (latest) imports langchain_community.chat_models.vertexai,
    # removed in the LangChain 1.x line — the 0.3.x line is what ragas expects.
    "langchain>=0.2.0,<1.0",
    "langchain-community>=0.2.0,<0.4",
    "langgraph>=0.1.0,<1.0",
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    # Observability
    # Config
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    # Utilities
    "tqdm>=4.66.0",
    "tenacity>=8.3.0",
    "tiktoken>=0.7.0",
    "datasets>=3.0",
    "pytest>=9.1.0",
]

[project.optional-dependencies]
# Offline PDF parsing stack (GPU). Not needed by the deployable serving app.
ingestion = [
    "pymupdf>=1.24.0",
    "docling>=2.0.0",
    "unstructured[pdf]>=0.21.5",
    "onnxruntime-gpu==1.26.0",
]
dashboard = [
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
]
agents = [
    "arize-phoenix-otel>=0.17.1",
    "langchain-core>=0.3.86",
    "langchain-ollama>=0.3.10",
    "langgraph>=0.6.11",
    "openinference-instrumentation-langchain>=0.1.73",
]

# Pin torch to a CUDA 12.1 build: compatible with onnxruntime-gpu (CUDA 12) and
# with both target drivers (local CUDA 13, server CUDA 12.2). Drop the CPU
# onnxruntime so it never clashes with onnxruntime-gpu (same import module).
[tool.uv]
override-dependencies = ["onnxruntime; sys_platform == 'never'"]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "eval: marks evaluation tests (require API keys)",
]

[dependency-groups]
# Installed by default by uv (a bare `uv run` / `uv sync` includes it), so this
# dev tooling is never pruned -- unlike an optional extra. Keeps the pre-commit
# hook, linters and test runner always present in the venv. pytest itself is a
# core dependency above.
dev = [
    "ipykernel>=7.3.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "matplotlib>=3.8.0",  # analysis/reporting scripts (scripts/)
]
